[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
    "src/pythonfmu3",
    "resources/*.dll",
    "resources/*.dylib",
    "resources/*.so",
    "examples/*.fmu",
    "examples/*.py",
    "pyproject.toml",
    "pytest.ini",
    "ruff.toml",
    "uv.lock",
]

[tool.hatch.build.targets.wheel]
packages = [
    "src/pythonfmu3",
]

[tool.hatch.metadata]
allow-direct-references = true

[project]
name = "pythonfmu3"
version = "0.4.0"
description = "A lightweight framework that enables the packaging of Python3.x code as co-simulation FMUs with (partial) FMI3 features support."
readme = "README.md"
requires-python = ">= 3.12"
license = { file = "LICENSE" }
authors = [
    { name = "Lars Ivar Hatledal"},
    { name = "Stephen Smith" },
    { name = "Siegfried Eisinger", email = "siegfried.eisinger@dnv.com" },
]
keywords = [
    "FMI", "simulation", "co-simulation", "FMI3"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: C++",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    # "Operating System :: MacOS",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
]
dependencies = [
    "fmpy>=0.3.21",
    "pyqt6>=6.10",
    "xmlschema>=4.3",
    "defusedxml>=0.7.1",
]


[project.optional-dependencies]
tests = [
    "fmpy",
    "pytest",
    "scipy",
]

[project.scripts]
pythonfmu3 = "pythonfmu3.__main__:cli_main"

[project.urls]
Homepage = "https://github.com/stephensmith25/PythonFMU3"
Documentation = "https://github.com/stephensmith25/PythonFMU3/README.html"
Repository = "https://github.com/StephenSmith25/PythonFMU3.git"

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-cov>=7.1",
    "ruff>=0.15.9",
    "pyright>=1.1.408",
    "mypy>=1.19.1",
    "sourcery>=1.43.0",
    "pre-commit>=4.5",
    "Sphinx>=9.0",
    "sphinx-argparse-cli>=1.21.3",
    "sphinx-autodoc-typehints>=3.6",
    "sphinxcontrib-mermaid>=2.0",
    "myst-parser>=5.0",
    "furo>=2025.12",
    "scipy-stubs>=1.17.1",
    "matplotlib>=3.10",
    "types-defusedxml",
    "rope>=1.15.0",
]

[tool.uv]
default-groups = [
    "dev",
]

native-tls = true
required-environments = [
    "sys_platform == 'win32'",
    "sys_platform == 'linux'",
    # "sys_platform == 'darwin'",
]

[tool.mypy]
plugins = []
mypy_path = "stubs"
files = [
    "src",
    "tests",
    "examples",
]


[tool.pytest]
# addopts = ["--strict-markers"]
markers = [
    "integration: marks integration tests",
    "doc: marks documentation tests"
]

[tool.pyright]
stubPath = "stubs"
include = [
    "src",
    "tests",
    "examples",
]
exclude = [
    "**/node_modules",
    "**/__pycache__",
    "**/.*",
    ".venv",
    "examples",  # python code here comes from other sources
    "tests/test_working_directory",
]
typeCheckingMode = "basic"
useLibraryCodeForTypes = true
reportMissingParameterType = "error"
reportUnknownParameterType = "warning"
reportUnknownMemberType = "warning"                # consider to set to `false` if you work a lot with matplotlib and pandas, which are both not properly typed and known to trigger this warning
reportMissingTypeArgument = "error"
reportPropertyTypeMismatch = "error"
reportFunctionMemberAccess = "warning"
reportPrivateUsage = "warning"
reportTypeCommentUsage = "warning"
reportIncompatibleMethodOverride = "warning"
reportIncompatibleVariableOverride = "error"
reportInconsistentConstructor = "error"
reportOverlappingOverload = "warning"
reportUninitializedInstanceVariable = "warning"
reportCallInDefaultInitializer = "warning"
reportUnnecessaryIsInstance = "information"
reportUnnecessaryCast = "warning"
reportUnnecessaryComparison = "warning"
reportUnnecessaryContains = "warning"
reportUnusedCallResult = "warning"
reportUnusedExpression = "warning"
reportMatchNotExhaustive = "warning"
reportUntypedFunctionDecorator = "warning"
reportUntypedClassDecorator = "warning"
reportUntypedBaseClass = "error"
reportUntypedNamedTuple = "warning"
reportUnnecessaryTypeIgnoreComment = "information"
# Activate the following rules only locally and temporary, i.e. for a QA session.
# (For server side CI they are considered too strict.)
# reportMissingTypeStubs = true
# reportConstantRedefinition = "warning"
# reportImportCycles = "warning"
# reportImplicitStringConcatenation = "warning"
